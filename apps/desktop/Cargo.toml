[package]
name = "urbanflow-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Desktop dependencies and build artifacts stay outside the core workspace.
[workspace]

[dependencies]
urbanflow = { path = "../.." }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_path_to_error = "0.1.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }

[profile.dev]
debug = 0
