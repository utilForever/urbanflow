[package]
name = "urbanflow-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Desktop dependencies and build artifacts stay outside the core workspace.
[workspace]

[dependencies]
urbanflow = { path = "../.." }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_path_to_error = "0.1.20"

[profile.dev]
debug = 0
