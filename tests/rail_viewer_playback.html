<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Rail viewer playback tests</title>
  <h1>Rail viewer playback tests</h1>
  <pre id="results">Running…</pre>
  <script type="module">
    // Serve the repository root, then open /tests/rail_viewer_playback.html.
    // Only the animation clock is replaced; DOM events and SVG geometry are real.
    const results = document.getElementById("results");
    const template = await fetch("../examples/rail_viewer/viewer.html", {
      cache: "no-store",
    }).then((response) => response.text());
    // This same hand-checked payload is verified against Rust in rail_viewer.rs.
    const serviceFixture = await fetch("./fixtures/rail_service.json", {
      cache: "no-store",
    }).then((response) => response.json());
    const stop = (index, node) => ({
      kind: "AtStop",
      stop_index: String(index),
      node,
      dwell_ticks_remaining: "1",
    });
    const travel = (index, edge, from, to, elapsed, total) => ({
      kind: "Traveling",
      edge_index: String(index),
      edge,
      from,
      to,
      travel_ticks_elapsed: String(elapsed),
      travel_ticks_total: String(total),
    });
    const positions = [
      stop(0, "7"),
      travel(0, "1", "7", "3", 0, 2),
      travel(0, "1", "7", "3", 1, 2),
      stop(1, "3"),
      travel(1, "2", "3", "7", 0, 1),
      { kind: "Complete", stop_index: "2", node: "7" },
    ];
    // Two demands share endpoints; both must contribute to the totals.
    const passengerCounts = [
      [
        [4, 0, 0, 0],
        [4, 0, 0, 0],
        [3, 0, 0, 0],
      ],
      [
        [0, 4, 0, 0],
        [2, 2, 0, 0],
        [3, 0, 0, 0],
      ],
      [
        [0, 4, 0, 0],
        [2, 2, 0, 0],
        [3, 0, 0, 0],
      ],
      [
        [0, 0, 4, 0],
        [2, 0, 2, 0],
        [0, 3, 0, 0],
      ],
      [
        [0, 0, 4, 0],
        [2, 0, 2, 0],
        [0, 3, 0, 0],
      ],
      [
        [0, 0, 4, 0],
        [0, 0, 2, 2],
        [0, 0, 3, 0],
      ],
    ];
    const snapshots = positions.map((position, index) => ({
      tick: String(18446744073709551610n + BigInt(index)),
      position,
      occupancy: [0, 6, 6, 3, 3, 0][index],
      capacity: 6,
      passengers: passengerCounts[index].map(
        ([waiting, onboard, arrived, unserved], demand) => ({
          from: demand === 2 ? "3" : "7",
          to: demand === 2 ? "7" : "3",
          amount: demand === 2 ? 3 : 4,
          waiting,
          onboard,
          arrived,
          unserved,
        }),
      ),
    }));
    const fixture = {
      nodes: ["7", "3"],
      edges: [
        { id: "0", from: "7", to: "3", kind: "Road" },
        { id: "1", from: "7", to: "3", kind: "Rail" },
        { id: "2", from: "3", to: "7", kind: "Rail" },
        { id: "3", from: "3", to: "7", kind: "Road" },
      ],
    };

    function installClock() {
      let now = 0,
        nextId = 0;
      const callbacks = new Map();
      performance.now = () => now;
      window.requestAnimationFrame = (callback) => {
        callbacks.set(++nextId, callback);
        return nextId;
      };
      window.cancelAnimationFrame = (id) => callbacks.delete(id);
      window.advanceTime = (milliseconds, paint = true, frameLag = 0) => {
        now += milliseconds;
        if (!paint) return;
        const pending = [...callbacks.values()];
        callbacks.clear();
        // Native frame timestamps can lag behind the latest control event.
        pending.forEach((callback) => callback(now - frameLag));
      };
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    let iframe;
    async function viewer(
      frames = snapshots,
      completed = true,
      data = {
        ...fixture,
        trace: { completed, snapshots: frames },
        analysis: null,
      },
    ) {
      iframe?.remove();
      iframe = document.createElement("iframe");
      iframe.title = "Viewer under test";
      iframe.width = "960";
      iframe.height = "800";
      const ready = new Promise((resolve) => (iframe.onload = resolve));
      iframe.srcdoc = template
        .replace("__TRACE_DATA__", JSON.stringify(data))
        .replace("<script>", `<script>(${installClock})();<\/script><script>`);
      document.body.append(iframe);
      await ready;
      const doc = iframe.contentDocument;
      const get = (id) => doc.getElementById(id);
      for (const id of ["play", "pause", "reset", "speed"])
        assert(get(id), `Missing playback control: ${id}`);
      return {
        get,
        advance: iframe.contentWindow.advanceTime,
        click: (id) => get(id).click(),
        change: (id, value) => {
          get(id).value = String(value);
          get(id).dispatchEvent(
            new iframe.contentWindow.Event(
              id === "snapshot" ? "input" : "change",
              { bubbles: true },
            ),
          );
        },
        point: () => ({
          x: Number(get("vehicle").getAttribute("cx")),
          y: Number(get("vehicle").getAttribute("cy")),
        }),
        onEdge: (index, progress) => {
          const path = doc.querySelectorAll("path.Rail")[index];
          const expected = path.getPointAtLength(
            path.getTotalLength() * progress,
          );
          const x = Number(get("vehicle").getAttribute("cx"));
          const y = Number(get("vehicle").getAttribute("cy"));
          assert(
            Math.hypot(x - expected.x, y - expected.y) < 0.1,
            `Marker must follow Rail edge ${index} at ${progress}`,
          );
        },
      };
    }

    function displays(v, id, expected) {
      assert(
        v.get(id)?.textContent === expected,
        `${id} must display ${expected}; got ${v.get(id)?.textContent ?? "no value"}`,
      );
    }

    function status(v, index) {
      const expected = [
        ["At stop", "Stop 0 · Node 7", "0 / 6", "11", "0", "0", "0"],
        ["Traveling", "Edge 1 · 7 → 3", "6 / 6", "5", "6", "0", "0"],
        ["Traveling", "Edge 1 · 7 → 3", "6 / 6", "5", "6", "0", "0"],
        ["At stop", "Stop 1 · Node 3", "3 / 6", "2", "3", "6", "0"],
        ["Traveling", "Edge 2 · 3 → 7", "3 / 6", "2", "3", "6", "0"],
        ["Complete", "Stop 2 · Node 7", "0 / 6", "0", "0", "9", "2"],
      ][index];
      displays(v, "status-tick", snapshots[index].tick);
      [
        "vehicle-state",
        "vehicle-location",
        "vehicle-load",
        "passenger-waiting",
        "passenger-onboard",
        "passenger-arrived",
        "passenger-unserved",
      ].forEach((id, field) => displays(v, id, expected[field]));
    }

    function selected(v, index) {
      assert(
        v.get("snapshot").value === String(index),
        `Expected snapshot ${index}`,
      );
      assert(
        v.get("tick").textContent.includes(snapshots[index].tick),
        "Tick must retain its exact recorded integer label",
      );
      status(v, index);
    }

    const tests = [
      [
        "core analysis displays immediately and stays fixed during playback",
        async () => {
          const v = await viewer(undefined, undefined, serviceFixture);
          const summary = v.get("analysis-summary");
          assert(!summary.hidden, "Completed summary is visible on load");
          const tables = [...summary.querySelectorAll("table")];
          const expected = [
            ["6", "4", "2", "66.7%"],
            ["20", "10", "8", "10", "2.00", "2.50", "4.50"],
            ["2", "2", "1.67", "10", "100.0%", "83.3%"],
            ["6", "4", "2", "6"],
            ["8", "2", "0", "2", "3", "2", "2", "0", "21", "0", "2", "0"],
          ];
          assert(tables.length === 5, "All five summaries have native tables");
          tables.forEach((table, index) =>
            assert(
              JSON.stringify(
                [...table.querySelectorAll("td")].map(
                  (cell) => cell.textContent,
                ),
              ) === JSON.stringify(expected[index]),
              `Values and units for ${table.caption.textContent} match the core fixture`,
            ),
          );
          const before = summary.innerHTML;
          v.click("play");
          v.advance(1500);
          v.change("speed", 4);
          v.advance(10000);
          v.change("snapshot", 3);
          v.click("reset");
          assert(
            summary.innerHTML === before,
            "Playback never changes final analysis",
          );
          displays(v, "status-tick", "0");
          iframe.width = "375";
          const doc = iframe.contentDocument;
          assert(
            doc.documentElement.scrollWidth <= doc.documentElement.clientWidth,
            "Summary fits on a narrow screen",
          );
        },
      ],
      [
        "analysis preserves exact integers, undefined means, zeroes, and repeated visits",
        async () => {
          const data = structuredClone(serviceFixture);
          data.analysis.passenger_outcomes.served_share = null;
          data.analysis.passenger_times.mean_waiting_ticks = null;
          data.analysis.passenger_times.mean_onboard_ticks = null;
          data.analysis.passenger_times.mean_journey_ticks = null;
          data.analysis.vehicle_occupancy.mean_occupancy = 0;
          data.analysis.vehicle_occupancy.max_load_factor = null;
          data.analysis.vehicle_occupancy.mean_load_factor = 0;
          data.analysis.route_timing.completion_tick = "18446744073709551615";
          data.analysis.stops[2].node = data.analysis.stops[0].node;
          const v = await viewer(undefined, undefined, data);
          const tables = v.get("analysis-summary").querySelectorAll("table");
          assert(
            tables[0].textContent.includes("N/A"),
            "Undefined share is N/A",
          );
          assert(
            tables[1].textContent.match(/N\/A/g).length === 3,
            "Undefined means are N/A",
          );
          assert(
            tables[2].textContent.includes("0.00"),
            "Zero mean is defined",
          );
          assert(
            tables[2].textContent.includes("0.0%"),
            "Zero load factor is defined",
          );
          assert(
            tables[2].textContent.includes("N/A"),
            "Undefined load factor is N/A",
          );
          assert(
            tables[3].textContent.includes("18446744073709551615"),
            "Exact completion tick",
          );
          assert(
            [...tables[4].tBodies[0].rows]
              .map((row) => row.cells[1].textContent)
              .join(",") === "8,3,8",
            "Repeated visits retain route order",
          );
        },
      ],
      [
        "lagging frame timestamps never hide or rewind the vehicle",
        async () => {
          const v = await viewer();
          v.advance(100, false);
          v.click("play");
          v.advance(1, true, 16);
          assert(
            v.get("vehicle").getAttribute("visibility") === "visible",
            "A frame timestamp before Play must not hide the vehicle",
          );
          selected(v, 0);

          v.change("snapshot", 1);
          v.click("play");
          v.advance(500);
          v.onEdge(0, 0.25);
          v.click("pause");
          v.advance(1000, false);
          v.click("play");
          v.advance(1, true, 16);
          v.onEdge(0, 0.2505);

          v.advance(100, false);
          v.change("speed", 2);
          v.onEdge(0, 0.3005);
          v.advance(1, true, 16);
          v.onEdge(0, 0.3015);
          selected(v, 1);
        },
      ],
      [
        "play, pause and resume follow curves, dwell, and stop at the final tick",
        async () => {
          const v = await viewer();
          assert(
            v.get("pause").disabled && !v.get("play").disabled,
            "Starts paused",
          );
          v.advance(1000);
          selected(v, 0);
          v.click("play");
          v.click("play");
          v.advance(500);
          v.onEdge(0, 0);
          v.advance(1000);
          selected(v, 1);
          v.onEdge(0, 0.25);
          v.advance(200, false);
          v.click("pause");
          v.onEdge(0, 0.35);
          const paused = v.point();
          v.advance(4000);
          selected(v, 1);
          assert(
            JSON.stringify(v.point()) === JSON.stringify(paused),
            "Pause freezes position",
          );
          v.click("play");
          v.advance(300);
          selected(v, 2);
          v.onEdge(0, 0.5);
          v.advance(500);
          selected(v, 2);
          v.onEdge(0, 0.75);
          v.advance(500);
          selected(v, 3);
          v.onEdge(0, 1);
          v.advance(500);
          v.onEdge(0, 1);
          v.advance(500);
          selected(v, 4);
          v.onEdge(1, 0);
          v.advance(500);
          v.onEdge(1, 0.5);
          v.advance(500);
          selected(v, 5);
          v.onEdge(1, 1);
          assert(
            v.get("play").disabled && v.get("pause").disabled,
            "End stops playback",
          );
          v.advance(10000);
          selected(v, 5);
        },
      ],
      [
        "speed changes preserve progress; seeking and resetting pause playback",
        async () => {
          const v = await viewer();
          v.change("snapshot", 1);
          selected(v, 1);
          v.click("play");
          v.advance(250);
          v.onEdge(0, 0.125);
          v.advance(250, false);
          v.change("speed", 2);
          v.onEdge(0, 0.25);
          v.advance(250);
          selected(v, 2);
          v.onEdge(0, 0.5);
          v.change("speed", 0.25);
          v.advance(1000);
          v.onEdge(0, 0.625);
          v.change("speed", 4);
          v.advance(125);
          v.onEdge(0, 0.875);
          v.change("snapshot", 4);
          selected(v, 4);
          assert(v.get("pause").disabled, "Seeking pauses playback");
          v.advance(3000);
          v.onEdge(1, 0);
          v.click("play");
          v.advance(125);
          v.onEdge(1, 0.5);
          v.click("reset");
          selected(v, 0);
          assert(
            v.get("pause").disabled && !v.get("play").disabled,
            "Reset pauses at start",
          );
          v.advance(3000);
          selected(v, 0);
          v.change("speed", 0.5);
          v.change("snapshot", 1);
          v.click("play");
          v.advance(1000);
          v.onEdge(0, 0.25);
          v.advance(100000);
          selected(v, 5);
          v.click("reset");
          selected(v, 0);
        },
      ],
      [
        "partial recordings stop without claiming completion",
        async () => {
          const v = await viewer(snapshots.slice(0, 3), false);
          v.click("play");
          v.advance(20000);
          selected(v, 2);
          v.onEdge(0, 0.5);
          assert(
            v.get("pause").disabled && v.get("play").disabled,
            "Partial end stops playback",
          );
          assert(
            v.get("trace-status").textContent === "Partial trace",
            "Partial badge is preserved",
          );
          assert(
            v.get("analysis-summary").hidden,
            "No final analysis for partial traces",
          );
          assert(
            v.get("analysis-help").textContent.includes("unavailable"),
            "Explains missing analysis",
          );
        },
      ],
      [
        "empty passenger lists display zero totals",
        async () => {
          const v = await viewer([{ ...snapshots[0], passengers: [] }], false);
          for (const field of ["waiting", "onboard", "arrived", "unserved"])
            displays(v, `passenger-${field}`, "0");
          displays(v, "vehicle-load", "0 / 6");
        },
      ],
      [
        "empty and single-frame traces cannot start playback",
        async () => {
          for (const frames of [
            [],
            snapshots.slice(0, 1),
            snapshots.slice(-1),
          ]) {
            const v = await viewer(
              frames,
              frames[0]?.position.kind === "Complete",
            );
            for (const id of ["play", "pause", "speed", "snapshot"])
              assert(
                v.get(id).disabled,
                `${id} must be disabled without an interval`,
              );
            v.click("play");
            v.click("reset");
            v.advance(10000);
            assert(
              v.get("vehicle").getAttribute("visibility") ===
                (frames.length ? "visible" : "hidden"),
              "Empty traces hide the marker",
            );
            assert(
              v
                .get("tick")
                .textContent.includes(frames[0]?.tick ?? "No snapshots"),
              "Static trace remains inspectable",
            );
            if (frames.length) {
              status(v, frames[0] === snapshots[0] ? 0 : 5);
            } else {
              displays(v, "vehicle-state", "No snapshots recorded");
              for (const id of [
                "status-tick",
                "vehicle-location",
                "vehicle-load",
                "passenger-waiting",
                "passenger-onboard",
                "passenger-arrived",
                "passenger-unserved",
              ])
                displays(v, id, "—");
            }
          }
        },
      ],
      [
        "status panel fits below the network on narrow screens",
        async () => {
          const v = await viewer();
          iframe.width = "375";
          const doc = iframe.contentDocument;
          const panel = doc
            .querySelector(".status-panel")
            .getBoundingClientRect();
          const network = v.get("network").getBoundingClientRect();
          assert(panel.top >= network.bottom, "Status must follow the network");
          assert(
            doc.documentElement.scrollWidth <= doc.documentElement.clientWidth,
            "The viewer must fit without horizontal scrolling",
          );
          selected(v, 0);
        },
      ],
    ];

    let failures = 0;
    results.textContent = "";
    for (const [name, run] of tests) {
      try {
        await run();
        results.textContent += `PASS ${name}\n`;
      } catch (error) {
        failures++;
        results.textContent += `FAIL ${name}: ${error.message}\n`;
      }
    }
    results.textContent += `${tests.length - failures}/${tests.length} passed`;
    document.title = failures ? "FAIL: Rail playback" : "PASS: Rail playback";
  </script>
</html>
