[package]
name = "urbanflow"
version = "0.1.0"
edition = "2024"
description = "A reinforcement learning environment for building and optimizing multimodal urban transit networks."
license = "MIT"
repository = "https://github.com/utilForever/urbanflow"
readme = "README.md"
keywords = ["simulation", "urban", "transport", "transit", "rl"]
categories = ["science", "simulation", "artificial-intelligence"]

[lib]
name = "urbanflow"
path = "src/lib.rs"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_path_to_error = "0.1.20"
