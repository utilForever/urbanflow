[package]
name = "urbanflow-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Keep the experimental UI dependency graph out of the library workspace.
[workspace]

[dependencies]
urbanflow = { path = "../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
serde_path_to_error = "0.1.20"
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
web-time = "=1.1.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.127"

[profile.dev]
debug = 0

[profile.release]
debug = 0
