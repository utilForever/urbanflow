<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Urbanflow GPUI trial</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f5f5f5;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #141414;
        }
        body #status {
          color: #ffffff;
        }
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        color: #242424;
        padding: 1rem;
        font: 16px system-ui;
      }
    </style>
  </head>
  <body>
    <p id="status" role="status">Loading the GPUI trial…</p>
    <script type="module">
      try {
        const { default: init } = await import("./pkg/urbanflow_gpui.js");
        await init();
        document.getElementById("status").remove();
      } catch (error) {
        document.getElementById("status").textContent =
          `GPUI could not start: ${error}. Use the offline HTML/SVG viewer described in README.md.`;
      }
    </script>
  </body>
</html>
